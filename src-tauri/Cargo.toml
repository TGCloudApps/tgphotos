[package]
name = "tgphotos"
version = "0.1.0"
description = "Fotos e vídeos sobre o Telegram"
authors = ["Felipe"]
edition = "2021"
default-run = "tgphotos"

[lib]
# O sufixo `_lib` evita colisão de nome com o binário (cargo#8519).
name = "tgphotos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tg-core = { path = "../../crates/tg-core" }
tg-app = { path = "../../crates/tg-app" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.47", features = ["rt-multi-thread", "sync", "macros", "io-util", "time", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ulid = "1"
sha2 = "0.10"
axum = { version = "0.7", default-features = false, features = ["json", "query"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
kamadak-exif = "0.6"
imagesize = "0.15"
# Inteligência de mídia: decodificar miniaturas (hash perceptual, entradas dos modelos).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Tokenizador dos modelos de busca (tokenizer.json do Hugging Face), Rust puro.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
half = "2"

# Desktop: apagar foto local = mandar para a lixeira do sistema (dá para desfazer).
# ONNX Runtime (modelos da inteligência de mídia). Desktop: binários oficiais
# baixados no build; Android: a biblioteca do AAR oficial (Gradle), carregada
# em tempo de execução.
[target.'cfg(not(target_os = "android"))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native", "api-22"] }

[target.'cfg(target_os = "android")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-22"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
trash = "5"
