# Release do TGPhotos: tag v* (ex.: v2.1.2) gera Android (APK assinado), Linux
# e Windows e publica na release da tag. A versão vem da tag: não é preciso
# mudar nenhum arquivo antes.
#
# O núcleo comum (crates/ e packages/) está em TGCloudApps/tgcloud-core: o job
# baixa o core e põe este app dentro dele, como no ambiente de desenvolvimento.
# Versão do core: a de `core.ref` (se existir, para fixar uma) ou a mais
# recente do main no momento da release.
#
# Secrets: CORE_DEPLOY_KEY (leitura do core), TG_API_ID/TG_API_HASH (Telegram),
# ANDROID_KEYSTORE_BASE64/ANDROID_KEYSTORE_PASSWORD/ANDROID_KEY_ALIAS/
# ANDROID_KEY_PASSWORD (gravados pelo assinar-android.sh).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ex.: v1.2.3)"
        required: true
      plataformas:
        description: "O que gerar (refazer só uma plataforma que falhou)"
        type: choice
        default: todas
        options: [todas, desktop, android, windows-arm64, flatpak, publish]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}-${{ github.event.inputs.plataformas == 'windows-arm64' && 'arm64' || github.event.inputs.plataformas == 'flatpak' && 'flatpak' || 'all' }}
  cancel-in-progress: false

env:
  APP: tgphotos
  PRODUCT: TGPhotos
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: Criar a release
    runs-on: ubuntu-latest
    outputs:
      draft: ${{ steps.release.outputs.draft }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Prepare release draft
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$PRODUCT ${TAG#v}" --notes-file .github/RELEASE_NOTES.md
          echo "draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" >> "$GITHUB_OUTPUT"

  desktop:
    name: ${{ matrix.name }}
    needs: release
    if: github.event.inputs.plataformas != 'android' && github.event.inputs.plataformas != 'publish' && github.event.inputs.plataformas != 'flatpak'
    strategy:
      fail-fast: false
      matrix:
        # An ARM64-only repair can run alongside other platforms without
        # replacing their assets. Published tags remain immutable.
        include: ${{ fromJSON(github.event.inputs.plataformas == 'windows-arm64' && '[{"name":"Windows ARM64","os":"windows-11-arm","target":"aarch64-pc-windows-msvc","bundles":"nsis"}]' || '[{"name":"Windows x64","os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis,msi"},{"name":"Windows ARM64","os":"windows-11-arm","target":"aarch64-pc-windows-msvc","bundles":"nsis"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Restrict Windows ARM64 temporary key inheritance
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: pwsh
        run: |
          # The ARM64 image grants Authenticated Users access to inherited files;
          # OpenSSH correctly rejects checkout's deploy key under that ACL.
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          $acl = New-Object System.Security.AccessControl.DirectorySecurity
          $acl.SetAccessRuleProtection($true, $false)
          foreach ($account in @($identity, 'NT AUTHORITY\SYSTEM')) {
            $rule = New-Object System.Security.AccessControl.FileSystemAccessRule($account, 'FullControl', 'ContainerInherit,ObjectInherit', 'None', 'Allow')
            $acl.AddAccessRule($rule)
          }
          Set-Acl -LiteralPath $env:RUNNER_TEMP -AclObject $acl
      - &core
        name: Núcleo comum (tgcloud-core)
        uses: actions/checkout@v5
        with:
          repository: TGCloudApps/tgcloud-core
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}
          fetch-depth: 0
      - &app
        name: Este app
        uses: actions/checkout@v5
        with:
          path: ${{ env.APP }}
          ref: ${{ env.TAG }}
          fetch-depth: 1
      - &prepare
        name: Versão do core, workspace e versão da tag
        shell: bash
        run: |
          if [ -f "$APP/core.ref" ]; then
            CORE=$(tr -d '[:space:]' < "$APP/core.ref")
          else
            CORE=$(git rev-parse origin/main)
          fi
          echo "core: $CORE"
          git checkout -q "$CORE"
          VERSION="${TAG#v}"
          node -e '
            const fs = require("fs");
            const [app, v] = process.argv.slice(1);
            // Workspace só com este app (o outro app não está aqui).
            let c = fs.readFileSync("Cargo.toml", "utf8");
            c = c.replace(/members = \[[^\]]*\]/, `members = ["crates/tg-controller", "crates/tg-core", "crates/tg-app", "${app}/src-tauri"]`);
            fs.writeFileSync("Cargo.toml", c);
            const root = JSON.parse(fs.readFileSync("package.json"));
            root.workspaces = ["packages/*", app];
            fs.writeFileSync("package.json", JSON.stringify(root, null, 2));
            // Versão da tag nos arquivos do app.
            const conf = `${app}/src-tauri/tauri.conf.json`;
            const t = JSON.parse(fs.readFileSync(conf)); t.version = v;
            fs.writeFileSync(conf, JSON.stringify(t, null, 2));
            const pkg = `${app}/package.json`;
            const p = JSON.parse(fs.readFileSync(pkg)); p.version = v;
            fs.writeFileSync(pkg, JSON.stringify(p, null, 2));
            const cargo = `${app}/src-tauri/Cargo.toml`;
            fs.writeFileSync(cargo, fs.readFileSync(cargo, "utf8").replace(/^version = ".*"$/m, `version = "${v}"`));
          ' "$APP" "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - &node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.APP }}-${{ matrix.target }}
      - &npm
        name: npm
        run: npm install --no-audit --no-fund
      - &lock
        name: Synchronize workspace lockfile with release version
        run: cargo update --workspace
      - name: Build e publicação
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ${{ env.APP }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          tagName: ${{ env.TAG }}
          releaseName: ${{ env.PRODUCT }} ${{ env.VERSION }}
          releaseDraft: ${{ needs.release.outputs.draft == 'true' }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  android:
    name: Android ${{ matrix.flavor }}
    needs: release
    if: github.event.inputs.plataformas != 'desktop' && github.event.inputs.plataformas != 'windows-arm64' && github.event.inputs.plataformas != 'publish' && github.event.inputs.plataformas != 'flatpak'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [mobile, tv]
    steps:
      - *core
      - *app
      - *prepare
      - *node
      - name: Rust (alvos Android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.APP }}-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # O runner já traz o Android SDK; só faltam as versões que o projeto usa.
      - name: Android SDK (NDK, build-tools, plataforma)
        run: |
          # O sdkmanager que vem no runner é antigo e não enxerga as plataformas
          # novas (android-37.0): atualiza o cmdline-tools e usa o novo.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmdline-tools;19.0"
          SDKM="$ANDROID_HOME/cmdline-tools/19.0/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "ndk;28.2.13676358" "build-tools;37.0.0" "platforms;android-37.0" "platform-tools"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - *npm
      - *lock
      - name: APK
        working-directory: ${{ env.APP }}
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ "${{ matrix.flavor }}" = tv ]; then
            export ORG_GRADLE_PROJECT_tgcloudControllerDefault=true
          fi
          npx tauri android build --apk --target aarch64 --target armv7 --target x86_64 --target i686
      - name: Assinar
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Sem a chave de assinatura: rode o assinar-android.sh na raiz do tgcloud."
            exit 1
          fi
          BT="$ANDROID_HOME/build-tools/37.0.0"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          IN="$APP/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          OUT="${PRODUCT}_${VERSION}_android-${{ matrix.flavor }}.apk"
          "$BT/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT" | head -5
          rm -f "$RUNNER_TEMP/release.jks" "$OUT.idsig"
          echo "APK=$OUT" >> "$GITHUB_ENV"
      - name: Publicar na release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber

  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: release
    if: github.event.inputs.plataformas != 'android' && github.event.inputs.plataformas != 'windows-arm64' && github.event.inputs.plataformas != 'publish'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - *core
      - *app
      - *prepare
      - *node
      - uses: dtolnay/rust-toolchain@stable
      - *npm
      - *lock
      - name: Free regenerable runner toolchains
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          python3 scripts/storage.py check --required-gib 15
      - name: Flatpak SDK
        run: |
          sudo add-apt-repository --yes ppa:flatpak/stable
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream gnupg
          flatpak --version
          dpkg --compare-versions "$(flatpak --version | awk '{print $2}')" ge 1.16
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.gnome.Sdk//51 org.gnome.Platform//51 org.freedesktop.Sdk.Extension.rust-stable//26.08 org.freedesktop.Sdk.Extension.node24//26.08
      - name: Build signed Flatpak
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_REPOSITORY_URL: ${{ vars.FLATPAK_REPOSITORY_URL }}
        run: |
          set -euo pipefail
          test -n "$FLATPAK_GPG_PRIVATE_KEY"
          test -n "$FLATPAK_REPOSITORY_URL"
          export GNUPGHOME="$RUNNER_TEMP/flatpak-gpg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$FLATPAK_GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          python3 packaging/flatpak/build-release.py "$APP" --repository-url "$FLATPAK_REPOSITORY_URL" --gpg-sign "$(cat packaging/flatpak/repository-key.fingerprint)" --gpg-homedir "$GNUPGHOME"
          rm -rf "$GNUPGHOME"
      - name: Upload Flatpak bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "target/flatpak/$APP/$APP-${{ matrix.arch }}.flatpak" --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    name: Validate artifacts and publish release
    needs: [release, desktop, android, flatpak]
    if: ${{ always() && github.event.inputs.plataformas != 'windows-arm64' && github.event.inputs.plataformas != 'flatpak' && needs.release.result == 'success' && (needs.desktop.result == 'success' || needs.desktop.result == 'skipped') && (needs.android.result == 'success' || needs.android.result == 'skipped') && (needs.flatpak.result == 'success' || needs.flatpak.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - *core
      - *app
      - name: Check Flatpak distribution credential
        env:
          GH_TOKEN: ${{ secrets.FLATPAK_DISTRIBUTION_TOKEN }}
        run: test -n "$GH_TOKEN" || { echo "::error::Missing FLATPAK_DISTRIBUTION_TOKEN"; exit 1; }
      - name: Finalize signed updater and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only release metadata tooling follows core main. Application
          # binaries are built from the immutable tag and its pinned core.ref.
          python3 scripts/finalize-release.py --repo "$GITHUB_REPOSITORY" --tag "$TAG" --product "$PRODUCT"
      - name: Synchronize signed Flatpak repository
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.FLATPAK_DISTRIBUTION_TOKEN }}
        run: python3 scripts/sync-flatpak-release.py --app "$APP" --tag "$TAG"
